<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jcsylvan.ai</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", monospace;
      background-color: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: 150px;
      height: 150px;
      margin-bottom: 3rem;
      border-radius: 50%;
    }

    .prompt-container {
      display: flex;
      align-items: center;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 0.75rem 1rem;
      width: 90%;
      max-width: 560px;
      background-color: #111;
      transition: border-color 0.2s ease;
    }

    .prompt-container:focus-within {
      border-color: #888;
    }

    .prompt-caret {
      color: #666;
      margin-right: 0.75rem;
      font-size: 1rem;
      user-select: none;
    }

    .prompt-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }

    .prompt-input::placeholder {
      color: #444;
    }

    .prompt-submit {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 0.25rem;
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
    }

    .prompt-submit:hover {
      color: #fff;
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .protected-btn, .nav-btn {
      background: none;
      border: 1px solid #333;
      border-radius: 4px;
      color: #555;
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.5rem 1.25rem;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
      letter-spacing: 0.05em;
      text-decoration: none;
    }

    .protected-btn:hover, .nav-btn:hover {
      color: #e0e0e0;
      border-color: #888;
    }

    .nav-btn {
      color: #f0c040;
      border-color: #4a3a10;
    }

    .nav-btn:hover {
      border-color: #f0c040;
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="jcsylvan.ai" class="logo" />
  <form class="prompt-container" onsubmit="return false;">
    <span class="prompt-caret">&gt;</span>
    <input
      type="text"
      class="prompt-input"
      placeholder="hello world..."
      autofocus
      spellcheck="false"
    />
    <button type="submit" class="prompt-submit" aria-label="Submit">&#8594;</button>
  </form>
  <div class="btn-row">
    <a href="solar-gain.html" class="nav-btn">&#9788; solar gain tool</a>
    <button class="protected-btn" onclick="unlock()">&#128274; harps</button>
  </div>
  <script>
    async function unlock() {
      const pw = prompt("password:");
      if (!pw) return;
      const hash = Array.from(
        new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw)))
      ).map(b => b.toString(16).padStart(2, "0")).join("");
      if (hash === "7b2e9f882fb00c76d3863ad4d12a8254bc146fdcf8934dfb20322f6598f03e0c") {
        window.location.href = "https://jcsylvan.github.io/super-duper-funicular";
      } else {
        alert("access denied");
      }
    }
  </script>
</body>
</html>
