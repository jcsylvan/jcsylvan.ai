<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jcsylvan.ai</title>
  <meta name="description" content="jcsylvan.ai — personal site of jcsylvan.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #e0e0e0;
      --muted: #666;
      --line: #2a2a2a;
      --accent: #f0c040;

      /* spacing scale */
      --s1: 0.5rem;
      --s2: 1rem;
      --s3: 2rem;
      --s4: 3rem;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", monospace;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--s3);
      text-align: center;
    }

    .logo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      display: block;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .logo:hover {
      transform: scale(1.03);
      box-shadow: 0 0 0 1px rgba(240, 192, 64, 0.35);
    }

    .wordmark {
      margin-top: var(--s3);
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      color: var(--fg);
    }

    .tagline {
      margin-top: var(--s1);
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    nav {
      margin-top: var(--s4);
      display: flex;
      gap: var(--s2);
      flex-wrap: wrap;
      justify-content: center;
    }

    .link {
      background: none;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.5rem 1.25rem;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .link:hover,
    .link:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
      outline: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .logo { transition: none; }
      .logo:hover { transform: none; }
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="jcsylvan.ai fox logo" class="logo" />

  <div class="wordmark">jcsylvan.ai</div>
  <p class="tagline">notes, tools &amp; experiments</p>

  <nav>
    <a href="solar-gain.html" class="link">farm</a>
    <a href="nis2-tracker.html" class="link">tools</a>
    <a href="reads.html" class="link">puck is here</a>
    <button class="link" onclick="unlock()">harps</button>
  </nav>

  <script>
    async function unlock() {
      const pw = prompt("password:");
      if (!pw) return;
      const hash = Array.from(
        new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw)))
      ).map(b => b.toString(16).padStart(2, "0")).join("");
      if (hash === "7b2e9f882fb00c76d3863ad4d12a8254bc146fdcf8934dfb20322f6598f03e0c") {
        window.location.href = "https://jcsylvan.github.io/super-duper-funicular";
      } else {
        alert("access denied");
      }
    }
  </script>
</body>
</html>
