<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jcsylvan.ai</title>
  <meta name="description" content="jcsylvan.ai — personal site of jcsylvan.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #e0e0e0;
      --muted: #666;
      --accent: #f0c040;
      --print-ring: #3a3320;

      /* spacing scale */
      --s1: 0.5rem;
      --s2: 1rem;
      --s3: 2rem;
      --s4: 3rem;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", monospace;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--s3);
      text-align: center;
    }

    .logo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      display: block;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .logo:hover {
      transform: scale(1.03);
      box-shadow: 0 0 0 1px rgba(240, 192, 64, 0.35);
    }

    .wordmark {
      margin-top: var(--s3);
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      color: var(--fg);
    }

    .tagline {
      margin-top: var(--s1);
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    nav {
      margin-top: var(--s4);
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tile {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 1px solid #262626;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      color: #6f6f6f;
      padding: 0;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .tile svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    .tile:hover,
    .tile:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
      transform: scale(1.06);
      outline: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .tile { transition: color 0.2s ease, border-color 0.2s ease; }
      .logo:hover, .tile:hover, .tile:focus-visible { transform: none; }
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="jcsylvan.ai fox logo" class="logo" />

  <div class="wordmark">jcsylvan.ai</div>
  <p class="tagline">notes, tools &amp; experiments</p>

  <nav>
    <!-- farm — Mount Fuji, sun, wave -->
    <a href="solar-gain.html" class="tile" aria-label="farm" title="farm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 19 L12 6 L21 19 Z"/>
        <path d="M9 11 L10.5 9 L12 11 L13.5 9 L15 11"/>
        <circle cx="17.6" cy="6.6" r="2"/>
        <path d="M4 21.5 q2 -1.6 4 0 t4 0 t4 0 t4 0"/>
      </svg>
    </a>

    <!-- tools — crossed mallet &amp; chisel -->
    <a href="tools.html" class="tile" aria-label="tools" title="tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g transform="rotate(34 12 12)">
          <path d="M11 2.5 L13 2.5 L12 1 Z"/>
          <line x1="12" y1="2.5" x2="12" y2="13"/>
          <rect x="10.4" y="13" width="3.2" height="7.5" rx="1"/>
        </g>
        <g transform="rotate(-34 12 12)">
          <line x1="12" y1="10" x2="12" y2="21.5"/>
          <rect x="7.2" y="4.2" width="9.6" height="5.8" rx="1.6"/>
        </g>
      </svg>
    </a>

    <!-- reads — open book -->
    <a href="reads.html" class="tile" aria-label="reads — puck is here" title="reads — puck is here">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 7 C9 5.4 5.6 5.4 3 6.6 L3 18 C5.6 16.8 9 16.8 12 18.6"/>
        <path d="M12 7 C15 5.4 18.4 5.4 21 6.6 L21 18 C18.4 16.8 15 16.8 12 18.6"/>
        <line x1="12" y1="7" x2="12" y2="18.6"/>
      </svg>
    </a>

    <!-- harps — koto (locked) -->
    <button class="tile" onclick="unlock()" aria-label="harps — locked" title="harps — locked">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="10" width="18" height="5" rx="1.5"/>
        <line x1="4.6" y1="11.6" x2="19.4" y2="11.6"/>
        <path d="M7 15 L8 11.2 L9 15"/>
        <path d="M11.5 15 L12.5 11.2 L13.5 15"/>
        <path d="M16 15 L17 11.2 L18 15"/>
      </svg>
    </button>
  </nav>

  <script>
    async function unlock() {
      const pw = prompt("password:");
      if (!pw) return;
      const hash = Array.from(
        new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw)))
      ).map(b => b.toString(16).padStart(2, "0")).join("");
      if (hash === "7b2e9f882fb00c76d3863ad4d12a8254bc146fdcf8934dfb20322f6598f03e0c") {
        window.location.href = "https://jcsylvan.github.io/super-duper-funicular";
      } else {
        alert("access denied");
      }
    }
  </script>
</body>
</html>
