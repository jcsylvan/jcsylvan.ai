[email]
smtp_server = smtp.gmail.com
smtp_port = 587
sender_email = your_email@gmail.com
# Use an App Password for Gmail (not your regular password)
# See: https://support.google.com/accounts/answer/185833
sender_password = your_app_password_here
recipient_email = your_email@gmail.com

[twitter]
# X/Twitter API v2 Bearer Token
# See: https://developer.twitter.com/en/docs/authentication/oauth-2-0/bearer-tokens
bearer_token = your_bearer_token_here

[arxiv]
# Categories to search (comma-separated)
categories = cs.AI,quant-ph,q-bio

[website]
# Path to the arxiv-archive.html page for updating results
archive_path = /home/user/jcsylvan.ai/arxiv-archive.html
# JSON data file for archive history
data_path = /home/user/jcsylvan.ai/arxiv-data.json
